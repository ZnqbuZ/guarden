[package]
name = "guarden"
repository.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Scoped cleanup and async guards that await inline and detach on cancellation"
readme = "README.md"

[lib]

[features]
default = ["tokio"]
tokio = ["dep:tokio"]

[dependencies]
derive_more = { version = "2.1.1", features = ["debug", "deref", "deref_mut"] }
guarden-macros = { workspace = true }
futures-core = { version = "0.3", default-features = false }
tokio = { version = "1.52", features = ["rt"], optional = true }

[dev-dependencies]
tokio = { version = "1.52", features = ["full"] }
tokio-test = "0.4"

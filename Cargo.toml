[workspace]
resolver = "3"
members = [
    "guarden",
    "guarden-macros",
]

[workspace.package]
repository = "https://github.com/ZnqbuZ/guarden"
version = "0.4.4"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
keywords = ["guard", "defer", "scope", "macro", "cleanup"]
categories = ["development-tools", "rust-patterns"]

[workspace.dependencies]
guarden-macros = { version = "0.4.4", path = "guarden-macros" }
